apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: py-app
    namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}

  # Deployment strategy
  strategy:
    type: Recreate

  # Wait for a new Pod to remain ready before
  # considering the rollout ready
  minReadySeconds: 5

  # Allow time for rollout progress
  progressDeadlineSeconds: 120

  selector:
    matchLabels:
      app: v1

  template:
    metadata:
      labels:
        app: v1
    spec:
      containers:
        - name: c1
          image: ghcr.io/saisrujan-asara/my-app:{{ .Values.image_version }}
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

      imagePullSecrets:
        - name: ghcr-secret
