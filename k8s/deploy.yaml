apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-app
  labels:
    app: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: v1
  template:
    metadata:
      labels:
        app: v1
    spec:
      containers:
        - name: c1
          image: nexus-docker-asarasaisrujan-dev.apps.rm1.0a51.p1.openshiftapps.com/my-app:${BUILD_NUMBER}
          ports:
            - containerPort: 5000

          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

      imagePullSecrets:
        - name: nexus-secret