apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-app
  labels:
    app: py-app
spec:
  replicas: 3

  # Deployment strategy
  strategy:
    type: Recreate

  # Wait for a new Pod to remain ready before
  # considering the rollout ready
  minReadySeconds: 5

  # Allow time for rollout progress
  progressDeadlineSeconds: 120

  selector:
    matchLabels:
      app: v1

  template:
    metadata:
      labels:
        app: v1
    spec:
      containers:
        - name: c1
          image: nexus-docker-asarasaisrujan-dev.apps.rm1.0a51.p1.openshiftapps.com/my-app:${BUILD_NUMBER}

          ports:
            - name: http
              containerPort: 5000

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

      imagePullSecrets:
        - name: nexus-secret
