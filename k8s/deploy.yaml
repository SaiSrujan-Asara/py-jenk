apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-app
  labels:
    app: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: v1
  template:
    metadata:
      labels:
        app: v1
    spec:
      containers:
        - name: c1
          image: nexus-docker-asarasaisrujan-dev.apps.rm1.0a51.p1.openshiftapps.com/my-app:61
          ports:
            - containerPort: 5000
      imagePullSecrets:
        - name: nexus-secret