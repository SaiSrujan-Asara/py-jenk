# Unique identifier for your project
sonar.projectKey=py-app1
sonar.projectName=py-app1
sonar.projectVersion=1.0

# Path to the source code (usually the current directory '.')
sonar.sources=.

# Language selection (SonarQube uses this to optimize the scan)
sonar.language=py

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# (Optional) Exclude directories you don't want to scan
sonar.exclusions=**/venv/**, **/site-packages/**, **/.pytest_cache/**, **/tests/**, k8s/**, jenkins-agents/**